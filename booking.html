<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tell us a little about the trip you have in mind."><title>Plan a Trip — Roam & Root</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body><div class="announcement">A little more wonder, a little less planning. <a href="packages.html">Meet your next favourite trip →</a></div><header class="site-header" data-shell="header"></header><main><section class="page-intro"><span class="eyebrow">LET’S MAKE A PLAN</span><h1>Start with a hello.</h1><p>Tell us what you’re dreaming about. This is just a first note, no commitment, no pressure. A real person from our little team will get back to you.</p></section><section class="page-content"><form class="form-card" id="booking-form" novalidate><div class="form-grid"><div class="form-field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" required placeholder="What should we call you?"></div><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="form-field"><label for="destination">Where are you thinking?</label><select id="destination" name="destination" required><option value="">Pick a place</option><option>Italian Riviera</option><option>Japan</option><option>Greek Islands</option><option>Swiss Alps</option><option>Somewhere else</option></select></div><div class="form-field"><label for="date">Roughly when?</label><input id="date" name="date" type="month"></div><div class="form-field"><label for="travellers">How many travellers?</label><select id="travellers" name="travellers"><option>Just me</option><option selected>2 travellers</option><option>3–4 travellers</option><option>5 or more</option></select></div><div class="form-field"><label for="budget">Budget per person</label><select id="budget" name="budget"><option>Not sure yet</option><option>Under $2,000</option><option>$2,000–$3,500</option><option>$3,500+</option></select></div><div class="form-field full"><label for="notes">Anything else we should know?</label><textarea id="notes" name="notes" placeholder="The kind of days you enjoy, a special occasion, or questions on your mind..."></textarea></div><div class="form-field full"><button class="button button-dark" type="submit">Send a little note <span>↗</span></button><div class="form-message" role="status" aria-live="polite"></div></div></div></form></section></main><footer class="site-footer" data-shell="footer"></footer></body></html>
